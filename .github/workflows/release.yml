name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project and development tools
        run: python -m pip install --group dev --editable .
      - name: Verify tag matches package version
        run: |
          version="$(python -c "from importlib.metadata import version; print(version('dinahosting-cli'))")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Quality gate
        run: |
          python -m black --check .
          python -m ruff check .
          python -m mypy .
          python -m pytest --cov
          python -m bandit -r .
          python -m pip_audit
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "dinahosting-cli ${GITHUB_REF_NAME}" \
            --notes "First public release of dinahosting-cli, a Python CLI and client for the Dinahosting API."
