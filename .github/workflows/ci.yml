name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project and development tools
        run: python -m pip install --group dev .
      - name: Format
        run: python -m black --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy .
      - name: Test
        run: python -m pytest --cov
      - name: Security scan
        run: python -m bandit -r .
      - name: Dependency audit
        run: python -m pip_audit
